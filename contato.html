<head>
  <meta charset="UTF-8">

  <title>ANMPOL - Contato</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav-bar">
    <a href="index.html" class="brand">
      <img src="img/logo.png" alt="Logo ANMPOL" class="logo">
    </a>

    <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-controls="menu" aria-expanded="false">
      ☰
    </button>

    <nav id="menu" class="site-nav" aria-label="Menu principal">
      <div class="menu-header">
        <span>Menu</span>
        <button class="menu-close" type="button" aria-label="Fechar menu">✕</button>
      </div>

      <a href="index.html">Início</a>
      <a href="sobre.html">Quem Somos</a>
      <a href="diaspora.html">Diáspora</a>
      <a href="missao.html">Missão</a>

      <a href="assembleia.html">Assembleias</a>
      <a href="contato.html" class="active">Contato</a>
    </nav>
  </div>
</header>

<div id="overlay"></div>

<main class="page-main">
  <section class="page-hero">
    <div class="container">
      <h1>Contato</h1>
      <p>Entre em contato com a ANMPOL para cooperação institucional.</p>
    </div>
  </section>

  <section class="content-section">
    <div class="container narrow">
      <form class="contact-form" id="formContato">
        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>

        <div class="form-group">
          <label for="whats">WhatsApp</label>
          <input type="text" id="whats" name="whats" placeholder="seu número" required>
        </div>

        <div class="form-group">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva sua mensagem"></textarea>
        </div>

        <button type="submit" class="btn">Enviar mensagem</button>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">

    <p>

        >

  </div>
